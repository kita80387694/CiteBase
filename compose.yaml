services:
  db:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_DB: citebase
      POSTGRES_USER: citebase
      POSTGRES_PASSWORD: ${DB_PASSWORD:-citebase-local}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - citebase-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citebase -d citebase"]
      interval: 3s
      timeout: 3s
      retries: 30
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/citebase
      DB_USER: citebase
      DB_PASSWORD: ${DB_PASSWORD:-citebase-local}
      MODEL_MODE: ${MODEL_MODE:-mock}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      TASK_WORKER_CONCURRENCY: ${TASK_WORKER_CONCURRENCY:-2}
      TASK_LEASE_SECONDS: ${TASK_LEASE_SECONDS:-30}
      TASK_HEARTBEAT_SECONDS: ${TASK_HEARTBEAT_SECONDS:-5}
      TASK_MAX_ATTEMPTS: ${TASK_MAX_ATTEMPTS:-3}
      EVALUATION_TASK_MAX_ATTEMPTS: ${EVALUATION_TASK_MAX_ATTEMPTS:-5}
      EVALUATION_ITEM_MAX_ATTEMPTS: ${EVALUATION_ITEM_MAX_ATTEMPTS:-2}
      AGENT_TASK_MAX_ATTEMPTS: ${AGENT_TASK_MAX_ATTEMPTS:-2}
      TASK_POLL_MILLIS: ${TASK_POLL_MILLIS:-500}
      TASK_RETRY_DELAY_SECONDS: ${TASK_RETRY_DELAY_SECONDS:-3}
      RETRIEVAL_CACHE_MAX_ENTRIES: ${RETRIEVAL_CACHE_MAX_ENTRIES:-128}
      RETRIEVAL_CACHE_TTL_SECONDS: ${RETRIEVAL_CACHE_TTL_SECONDS:-300}
      RETRIEVAL_CACHE_MAX_BYTES: ${RETRIEVAL_CACHE_MAX_BYTES:-8000000}
      OPERATIONS_TOKEN: ${OPERATIONS_TOKEN:-}
      CHAT_BASE_URL: ${CHAT_BASE_URL:-https://api.siliconflow.cn}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-deepseek-ai/DeepSeek-V3.2}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.siliconflow.cn}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-60}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-https://api.siliconflow.cn}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANK_TIMEOUT_SECONDS: ${RERANK_TIMEOUT_SECONDS:-10}
      AGENT_CHAT_BASE_URL: ${AGENT_CHAT_BASE_URL:-}
      AGENT_CHAT_API_KEY: ${AGENT_CHAT_API_KEY:-}
      AGENT_CHAT_MODEL: ${AGENT_CHAT_MODEL:-}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 30s
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  citebase-db:
